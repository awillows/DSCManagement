name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]

env:
  MODULE_NAME: DSCManagement

jobs:
  test:
    name: Test PowerShell ${{ matrix.psversion }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2019]
        psversion: [5.1, 7.2, 7.3, 7.4]
        exclude:
          - os: windows-2019
            psversion: 7.4

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup PowerShell
      if: matrix.psversion != '5.1'
      uses: actions/setup-powershell@v1
      with:
        powershell-version: ${{ matrix.psversion }}

    - name: Install Dependencies
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module -Name Pester -Force -SkipPublisherCheck
        Install-Module -Name PSScriptAnalyzer -Force
        Install-Module -Name ModuleBuilder -Force

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        $results = Invoke-ScriptAnalyzer -Path .\Public\, .\Private\ -Settings .\PSScriptAnalyzerSettings.psd1 -Recurse
        if ($results) {
          $results | Format-Table -AutoSize
          throw "PSScriptAnalyzer found $($results.Count) issues"
        }
        Write-Host "✅ PSScriptAnalyzer passed with no issues" -ForegroundColor Green

    - name: Run Pester Tests
      shell: pwsh
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = '.\Tests\'
        $config.Run.PassThru = $true
        $config.CodeCoverage.Enabled = $true
        $config.CodeCoverage.Path = '.\Public\*.ps1', '.\Private\*.ps1'
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputFormat = 'NUnitXml'
        $config.TestResult.OutputPath = 'TestResults.xml'
        
        $result = Invoke-Pester -Configuration $config
        
        if ($result.FailedCount -gt 0) {
          throw "Pester tests failed: $($result.FailedCount) failed out of $($result.TotalCount)"
        }
        
        Write-Host "✅ All $($result.TotalCount) tests passed" -ForegroundColor Green

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-ps${{ matrix.psversion }}
        path: TestResults.xml

    - name: Upload Coverage to Codecov
      if: matrix.os == 'windows-latest' && matrix.psversion == '7.4'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: powershell
        name: codecov-${{ matrix.os }}-ps${{ matrix.psversion }}

  security-scan:
    name: Security Scan
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run DevSkim
      uses: microsoft/DevSkim-Action@v1
      with:
        directory-to-scan: ./

    - name: Upload DevSkim Results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: devskim-results.sarif

  build:
    name: Build Module
    runs-on: windows-latest
    needs: [test]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup PowerShell
      uses: actions/setup-powershell@v1
      with:
        powershell-version: 7.4

    - name: Install Dependencies
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module -Name ModuleBuilder -Force

    - name: Build Module
      shell: pwsh
      run: |
        # Validate module manifest
        $manifest = Test-ModuleManifest -Path .\${{ env.MODULE_NAME }}.psd1
        Write-Host "✅ Module manifest is valid" -ForegroundColor Green
        Write-Host "Module Version: $($manifest.Version)" -ForegroundColor Cyan
        
        # Create build output directory
        $buildPath = ".\build\${{ env.MODULE_NAME }}"
        New-Item -Path $buildPath -ItemType Directory -Force | Out-Null
        
        # Copy module files
        Copy-Item -Path .\${{ env.MODULE_NAME }}.psd1 -Destination $buildPath
        Copy-Item -Path .\${{ env.MODULE_NAME }}.psm1 -Destination $buildPath
        Copy-Item -Path .\Public -Destination $buildPath -Recurse
        Copy-Item -Path .\Private -Destination $buildPath -Recurse
        Copy-Item -Path .\Config -Destination $buildPath -Recurse
        Copy-Item -Path .\LICENSE -Destination $buildPath
        Copy-Item -Path .\README.md -Destination $buildPath
        Copy-Item -Path .\CHANGELOG.md -Destination $buildPath
        
        Write-Host "✅ Module built successfully" -ForegroundColor Green

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MODULE_NAME }}-module
        path: ./build/

  publish-test:
    name: Test Publish (Dry Run)
    runs-on: windows-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.MODULE_NAME }}-module
        path: ./build/

    - name: Test PowerShell Gallery Publish
      shell: pwsh
      run: |
        # Simulate publish to PowerShell Gallery
        $modulePath = ".\build\${{ env.MODULE_NAME }}"
        $manifest = Test-ModuleManifest -Path "$modulePath\${{ env.MODULE_NAME }}.psd1"
        
        Write-Host "Would publish module:" -ForegroundColor Yellow
        Write-Host "  Name: $($manifest.Name)" -ForegroundColor Cyan
        Write-Host "  Version: $($manifest.Version)" -ForegroundColor Cyan
        Write-Host "  Author: $($manifest.Author)" -ForegroundColor Cyan
        Write-Host "  Description: $($manifest.Description)" -ForegroundColor Cyan

  publish-gallery:
    name: Publish to PowerShell Gallery
    runs-on: windows-latest
    needs: [build, test]
    if: github.event_name == 'release'
    environment: production
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.MODULE_NAME }}-module
        path: ./build/

    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      run: |
        $modulePath = ".\build\${{ env.MODULE_NAME }}"
        
        # Validate module one more time
        $manifest = Test-ModuleManifest -Path "$modulePath\${{ env.MODULE_NAME }}.psd1"
        Write-Host "Publishing module version $($manifest.Version)" -ForegroundColor Green
        
        # Publish to PowerShell Gallery
        Publish-Module -Path $modulePath -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
        
        Write-Host "✅ Module published successfully to PowerShell Gallery" -ForegroundColor Green

  create-github-release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: [publish-gallery]
    if: github.event_name == 'release'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.MODULE_NAME }}-module
        path: ./build/

    - name: Create Release Archive
      shell: pwsh
      run: |
        $version = (Import-PowerShellDataFile .\${{ env.MODULE_NAME }}.psd1).ModuleVersion
        Compress-Archive -Path ".\build\${{ env.MODULE_NAME }}\*" -DestinationPath "${{ env.MODULE_NAME }}-$version.zip"

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ env.MODULE_NAME }}-*.zip
        asset_name: ${{ env.MODULE_NAME }}-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip